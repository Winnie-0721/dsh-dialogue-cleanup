name: Pack and Release

# 打包与发布都在 CI 做——本地从此不产生任何打包产物，也不消耗 gh / npm token：
#   标签推送 → 门禁（release.ps1 内跑全部 test/*.test.mjs）→ pnpm pack
#   → 创建 GitHub Release 并传 tarball + version.json。
#
# 本地只剩轻量五步：门禁 → 递增 → 提交 → 打标签 → 推送（scripts/release.ps1 -Bump patch）。
# 回退 / 旧版安装一律从 GitHub Release 附件下载（仓库里不留任何 tarball）。
#
# workflow_dispatch 用于补跑 / 回填：按 package.json 的版本找到对应标签重新打包；
# Release 已存在则幂等补传附件（--clobber）。
#
# **npm 发布不在本文件里，本文件也不去调用 publish-npm.yml**（v1.1.1 / v1.1.2 查清的真因）：
#   npm 官方文档《Trusted publishing》写明，用 workflow_call 调用别的 workflow 发 npm 时
#   「validation checks the calling workflow's name instead of the workflow that actually
#    contains the publish command」。由本文件调用过去，npm 看到的是 pack-release.yml，
#   与它登记的 publish-npm.yml 不符 → 令牌交换被拒 → 一律 ENEEDAUTH。
#
#   现在 publish-npm.yml **自己监听同样的 `push: tags: ['v*']`**：两个 workflow 并列触发、
#   互不调用。本文件只负责「打包 + 建 GitHub Release」，发 npm 由那个文件自己来。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    # release.ps1 带 Windows 路径拼接，门禁与打包都在 Windows runner 上跑。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 门禁的可重入检查与 build 后缀（提交数.短哈希）都要全历史 + 标签。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: 安装 pnpm（CI 上没有 DSH 运行时，release.ps1 会用 PATH 上的 pnpm）
        run: npm install -g pnpm@latest

      - name: 门禁 → 打包 → 创建 Release
        run: pwsh -NoProfile -File scripts/release.ps1 -CiPack
        env:
          GH_TOKEN: ${{ github.token }}
