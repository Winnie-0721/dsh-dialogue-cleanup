name: Publish to npm

# 本文件是**唯一**的 npm 发布实现，也是 npm Trusted Publisher 上登记的那个文件名。
#
# ⚠️ 为什么必须由本文件亲自跑「发 npm」这件事（复刻自 dsh-plugin-market 的血泪教训）：
#    npm 的 Trusted Publisher 把信任绑定到**具体 workflow 文件名**（包设置页的
#    Workflow filename 字段，含 .yml）。OIDC 令牌里 npm 校验的是 `job_workflow_ref`，
#    而**实测**（见 docs/RELEASING.md）：
#      用 workflow_call 调用时  job_workflow_ref = 被调用的那个文件（= 本文件）
#                              workflow_ref     = 调用方文件
#    所以 pack-release.yml **不能自己重写一遍发布步骤**——那样令牌里的文件名是
#    pack-release.yml，与登记不符，npm 直接回：
#      npm error code ENEEDAUTH
#      npm error need auth This command requires you to be logged in to https://registry.npmjs.org/
#    （参考仓库 v1.1.6 与 v1.2.0 都踩了这个坑，当时靠手动跑本文件补发。）
#    正确做法：pack-release.yml 用 `uses: ./.github/workflows/publish-npm.yml` 复用它。
#    这样**发布逻辑只有一份**，且 OIDC 认的文件名仍然正确。
#
# 版本号由 release.ps1 独家管理，这里绝不 bump：
# npm version patch 会破坏 versionCode 归零纪律，且同版本重发会被 npm 拒。
on:
  # 人工建 Release 时触发（注意：GITHUB_TOKEN 创建的 Release 不会触发 workflow，
  # 所以标签发布那条路不靠这个事件，而是由 pack-release.yml 直接 workflow_call 本文件）。
  release:
    types: [published]
  # 手动触发：补发 / 重试都走这里。
  workflow_dispatch:
  # 被 pack-release.yml 复用——**这是标签发布那条路的正解**。
  workflow_call:

# id-token: write = npm Trusted Publishing（OIDC）：在 npmjs.com 给本包添加
# Trusted publisher（repository=本仓库、workflow=本文件名）后，publish 不再需要 NPM_TOKEN。
# 若改回 token 发布：给 publish 步骤加回 env: NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}。
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 【适配】本仓库的 package.json 在**根目录**（参考仓库在 plugin-market/ 子目录），
    # 所以这里**不设** working-directory，否则会 ENOENT。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          # 故意不写 registry-url：npmjs 是默认 registry；写它反而会让 setup-node
          # 注入 NODE_AUTH_TOKEN=github.token（对 npm 无效），可能盖过 OIDC。

      # OIDC 要求 npm ≥ 11.5.1（Node 自带的 10.x 不够新）。
      # **两个坑**：
      #  1) 不要写 `npm@latest`：npm 12 起要求 node ^22.22.2 || ^24.15.0 || >=26，
      #     而这里钉的是 node 22.14.0 → `npm install -g npm@latest` 会 EBADENGINE 失败，
      #     publish 根本没跑到（参考仓库 v1.1.6 第一次失败就是这个）。
      #  2) `npm stage` 子命令要较新的 11.x（11.8.0 还没有）。`^11.5.1` 解析到最新 11.x，两全。
      # 本包无依赖、无构建：不跑 npm ci（没有 package-lock.json 会直接失败），
      # checkout 下来就是发布内容。
      - run: npm install -g "npm@^11.5.1"

      # **身份自检：把「文件名不对」从一句神秘的 ENEEDAUTH 变成一句看得懂的错。**
      #
      # npm 的 Trusted Publisher 按 `job_workflow_ref` 里的**文件名**匹配，而这个字段
      # 只指向「实际执行本 job 的那个 workflow 文件」。如果哪天有人把发布步骤从
      # pack-release.yml 里自己跑一遍（或忘了用 workflow_call 复用），这里就会立刻
      # 红在**发布之前**，并且直接告诉你登记的是哪个文件、实际是哪个文件——
      # 而不是等到 `npm stage publish` 才甩一句 need auth。
      #
      # 注意：**不设 audience 之外的假设**——只请求令牌、解出声明、比对文件名。
      # 这一步不发布任何东西，纯读。
      - name: 自检 OIDC 身份（文件必须是 publish-npm.yml）
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.request

          # 本 job 必须拿到 id-token: write（调用方与被调用方都要声明，缺一个就没有这个变量）。
          base = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          if not base or not token:
              sys.exit("拿不到 OIDC 请求地址/令牌：确认调用方与被调用方都声明了 `id-token: write`。")

          # 用 npm 的 audience 请求，确保拿到的就是 npm 会校验的那张令牌。
          req = urllib.request.Request(
              base + "&audience=npm:registry.npmjs.org",
              headers={"Authorization": "bearer " + token},
          )
          jwt = json.load(urllib.request.urlopen(req))["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          job_ref = claims.get("job_workflow_ref", "")
          print(f"job_workflow_ref = {job_ref}")
          print(f"workflow_ref     = {claims.get('workflow_ref')}")

          expected = ".github/workflows/publish-npm.yml@"
          if expected not in job_ref:
              sys.exit(
                  "OIDC 身份不对：npm 按 job_workflow_ref 的文件名匹配 Trusted Publisher，"
                  f"登记的是 publish-npm.yml，但这次是 {job_ref.split('@')[0]}。"
                  "不要把发布步骤复制到别的 workflow 里跑——请用 `uses: ./.github/workflows/publish-npm.yml` 复用。"
              )
          print("OIDC 身份正确：npm 会认这个文件名。")
          PY

      # 幂等闸门（从 pack-release.yml 那个重复 job 搬过来的，别丢）：
      # 版本已在 npm 上就跳过——否则 pack-release 补跑 / workflow_dispatch 重跑时
      # `npm stage publish` 会因版本已存在而失败，把整个 Pack and Release 弄红。
      # 查的是 registry 上是否已有该版本（不是 dist-tags.latest，因为暂存发布在批准前
      # 不会更新 latest，用 latest 判断会误判成「没发过」）。
      - name: 该版本已在 npm 则跳过（补跑幂等）
        id: guard
        run: |
          SPEC=$(node -p "const p=require('./package.json'); p.name + '@' + p.version")
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"
          echo "目标：$SPEC"
          if npm view "$SPEC" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$SPEC 已在 npm（公开或已批准），跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$SPEC 尚未公开——将提交暂存发布（暂存后仍需人工 2FA 批准才公开）"
          fi

      # ⚠️ 首次发布前必须在 npmjs.com 给本包配置 Trusted Publisher
      # （repository=Winnie-0721/dsh-dialogue-cleanup、workflow=publish-npm.yml）。
      # 新包在**首次发布前**还没有包设置页，需用 npm 的 "pending publisher" 先登记——
      # 否则这一步会因 OIDC 无匹配而失败（见 docs/RELEASING.md）。
      # 本包的 Trusted Publisher 若只授予 `npm stage publish` 与 `npm dist-tag`
      # （没有 `npm publish`），普通 `npm publish` 会被拒：
      #   403 OIDC permission denied for this action
      # 所以走暂存发布；之后需人工批准（`npm stage approve <id>`，要 2FA）才公开。
      - name: Stage publish to npm
        if: steps.guard.outputs.skip == 'false'
        run: npm stage publish --access public

      - name: 提示下一步（暂存发布需人工批准）
        if: steps.guard.outputs.skip == 'false'
        run: |
          echo "::notice title=npm 暂存发布已提交::这个包用的是 staged publishing，还需人工批准才会公开。"
          echo "本地批准：npm stage list → npm stage approve <stage-id>（需要 2FA 一次性验证码）"
          echo "或去 npmjs.com 该包页面点 Approve。"
